name: Build Pages Preview

on:
  push:
    branches:
      - preview/pr-1-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/minitool/index.html
          test -f dist/minitool/js/app.js
          test -f dist/minitool/css/style.css

      - name: Publish static build to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/slotbound-pages
          mkdir -p /tmp/slotbound-pages
          cp -a dist/minitool/. /tmp/slotbound-pages/
          touch /tmp/slotbound-pages/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a /tmp/slotbound-pages/. .
          git add -A
          git commit -m "Deploy PR #1 preview to GitHub Pages"
          git push --force origin HEAD:gh-pages
