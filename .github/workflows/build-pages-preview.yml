name: Build Pages Preview

on:
  push:
    branches:
      - preview/pr-1-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Smoke test strategy runtime
        run: node tools/strategy-smoke.mjs

      - name: Smoke test progression runtime
        run: node tools/progression-smoke.mjs

      - name: Smoke test v1.4 preparation and slot control
        run: node tools/v14-smoke.mjs

      - name: Validate XHS package
        run: npm run check

      - name: Pack XHS minitool
        run: npm run pack

      - name: Verify build output
        run: |
          test -f dist/minitool/index.html
          test -f dist/minitool/js/app.js
          test -f dist/minitool/css/style.css
          test -f dist/slotbound-xhs-minitool.zip

      - name: Upload XHS submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: slotbound-xhs-minitool
          path: dist/slotbound-xhs-minitool.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish static build to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/slotbound-pages
          mkdir -p /tmp/slotbound-pages
          cp -a dist/minitool/. /tmp/slotbound-pages/
          touch /tmp/slotbound-pages/.nojekyll

          # Pages 专用 cache bust；不修改已经校验/打包的小红书 ZIP。
          VERSION="${GITHUB_SHA:0:8}"
          sed -i "s#./js/app.js#./js/app.js?v=${VERSION}#g" /tmp/slotbound-pages/index.html
          sed -i "s#./css/style.css#./css/style.css?v=${VERSION}#g" /tmp/slotbound-pages/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a /tmp/slotbound-pages/. .
          git add -A
          git commit -m "Deploy v1.4 preview to GitHub Pages"
          git push --force origin HEAD:gh-pages
